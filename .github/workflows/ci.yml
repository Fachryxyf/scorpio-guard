name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify the built package imports and runs
        run: node scripts/smoke.mjs

      # The manifest and the lockfile must agree, and packageManager must name the
      # tool that owns the lockfile. A bulk edit once broke this silently.
      - name: Verify the manifest matches the lockfile
        run: npm run check:manifest

      # The example is the adoption story: if it stops working, the README is wrong.
      - name: Run the integration example
        run: npm run example:integration

      # Renders every page without writing anything, so a broken generator fails in
      # CI rather than in the deploy. The published HTML is not committed; Pages
      # builds it in .github/workflows/pages.yml.
      - name: Verify the site generator renders every page
        run: npm run site:check

      # Numbers stated in the README are read back from the rendered site, so a hand
      # typed count fails here instead of ageing in public.
      - name: Verify the documented counts match the rendered site
        run: npm run check:docs

      # A decision with no test target is allowed; a stale index is not.
      - name: Verify the claim index matches the decisions and tests
        run: npm run check:claims

      # Budget in bench/budget.json, failing at twice the recorded p95. This catches a
      # change that makes evaluation cost more without anyone noticing.
      - name: Verify an evaluation is still within the recorded budget
        run: npm run bench

  # The gate the registry readers care about: what a stranger gets, installed.
  pack-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Packs the tarball, inspects its contents, installs it into an empty directory,
      # and runs the published surface from there.
      - name: Pack, inspect, and install the tarball
        run: npm run pack:check
